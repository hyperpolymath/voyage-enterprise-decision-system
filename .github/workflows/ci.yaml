# SPDX-License-Identifier: MPL-2.0
name: CI Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
env:
  REGISTRY: ghcr.io
  RUST_VERSION: "1.75"
  ELIXIR_VERSION: "1.16"
  OTP_VERSION: "26"
  JULIA_VERSION: "1.10"
jobs:
  # ===========================================================================
  # Rust Optimizer
  # ===========================================================================
  rust-build:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/rust-routing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src/rust-routing/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/rust-routing/Cargo.lock') }}
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --all-features
      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-optimizer
          path: src/rust-routing/target/release/veds-optimizer
  # ===========================================================================
  # Elixir API
  # ===========================================================================
  elixir-build:
    name: Elixir Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/elixir-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Elixir
        uses: erlef/setup-beam@ee09b1e59bb240681c382eb1f0abc6a04af72764 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Cache deps
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            src/elixir-api/deps
            src/elixir-api/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('src/elixir-api/mix.lock') }}
      - name: Install dependencies
        run: mix deps.get
      - name: Check formatting
        run: mix format --check-formatted
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: Run tests
        run: mix test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/veds_test
          MIX_ENV: test
  # ===========================================================================
  # Clojure Constraints
  # ===========================================================================
  clojure-build:
    name: Clojure Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/clojure-constraints
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.5
        with:
          cli: 1.11.1.1435
      - name: Cache deps
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-clj-${{ hashFiles('src/clojure-constraints/deps.edn') }}
      - name: Run tests
        run: clojure -M:test
      - name: Build uberjar
        run: clojure -T:build uber
  # ===========================================================================
  # Julia Visualization
  # ===========================================================================
  julia-build:
    name: Julia Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/julia-viz
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Julia
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9 # v2
        with:
          version: ${{ env.JULIA_VERSION }}
      - name: Cache Julia packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.julia/artifacts
            ~/.julia/packages
          key: ${{ runner.os }}-julia-${{ hashFiles('src/julia-viz/Project.toml') }}
      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'
  # ===========================================================================
  # Ada/SPARK Verification
  # ===========================================================================
  ada-verify:
    name: Ada/SPARK Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ada-spark-verify
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup GNAT
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat gprbuild
      - name: Build
        run: gprbuild -P veds_verify.gpr -XMODE=release
      - name: Run verification tests
        run: ./bin/veds_verify
        # SPARK proof (optional, requires SPARK Pro or Community)
        # - name: Run SPARK proofs
        #   run: gnatprove -P veds_verify.gpr --level=2
  # ===========================================================================
  # Integration Tests
  # ===========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [rust-build, elixir-build, clojure-build]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt
      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short
        env:
          HYPOTHESIS_PROFILE: ci
  # ===========================================================================
  # Property Tests
  # ===========================================================================
  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt
      - name: Run property tests
        run: pytest tests/property/ -v --hypothesis-profile=ci
  # ===========================================================================
  # Security Scanning
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
      - name: Rust audit
        working-directory: src/rust-routing
        run: |
          cargo install cargo-audit
          cargo audit
  # ===========================================================================
  # Build and Push Images
  # ===========================================================================
  build-images:
    name: Build Container Images
    runs-on: ubuntu-latest
    needs: [rust-build, elixir-build, clojure-build, julia-build, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        service:
          - name: rust-optimizer
            context: src/rust-routing
          - name: elixir-api
            context: src/elixir-api
          - name: clojure-constraints
            context: src/clojure-constraints
          - name: julia-viz
            context: src/julia-viz
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/veds-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest container provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/veds-${{ matrix.service.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  # ===========================================================================
  # Update ArgoCD
  # ===========================================================================
  update-argocd:
    name: Update ArgoCD Image Tags
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Update image tags in kustomization
        run: |
          cd deploy/k3s/base
          kustomize edit set image \
            ghcr.io/veds/rust-optimizer=ghcr.io/${{ github.repository_owner }}/veds-rust-optimizer:${{ github.sha }} \
            ghcr.io/veds/elixir-api=ghcr.io/${{ github.repository_owner }}/veds-elixir-api:${{ github.sha }} \
            ghcr.io/veds/clojure-constraints=ghcr.io/${{ github.repository_owner }}/veds-clojure-constraints:${{ github.sha }} \
            ghcr.io/veds/julia-viz=ghcr.io/${{ github.repository_owner }}/veds-julia-viz:${{ github.sha }}
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deploy/
          git commit -m "ci: update image tags to ${{ github.sha }}" || exit 0
          git push
permissions:
  contents: read
