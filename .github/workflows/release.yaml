# SPDX-License-Identifier: MPL-2.0
name: Release
on:
  push:
    tags:
      - 'v*'
env:
  REGISTRY: ghcr.io
jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      # Build and push all service images with version tag
      - name: Build rust-optimizer
        id: push_rust
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/rust-routing
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/veds-rust-optimizer:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/veds-rust-optimizer:latest
      - name: Attest rust-optimizer provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/veds-rust-optimizer
          subject-digest: ${{ steps.push_rust.outputs.digest }}
          push-to-registry: true
      - name: Build elixir-api
        id: push_elixir
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/elixir-api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/veds-elixir-api:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/veds-elixir-api:latest
      - name: Attest elixir-api provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/veds-elixir-api
          subject-digest: ${{ steps.push_elixir.outputs.digest }}
          push-to-registry: true
      - name: Build clojure-constraints
        id: push_clojure
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/clojure-constraints
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/veds-clojure-constraints:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/veds-clojure-constraints:latest
      - name: Attest clojure-constraints provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/veds-clojure-constraints
          subject-digest: ${{ steps.push_clojure.outputs.digest }}
          push-to-registry: true
      - name: Build julia-viz
        id: push_julia
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: src/julia-viz
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/veds-julia-viz:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/veds-julia-viz:latest
      - name: Attest julia-viz provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/veds-julia-viz
          subject-digest: ${{ steps.push_julia.outputs.digest }}
          push-to-registry: true
      # Update production kustomization
      - name: Update production image tags
        run: |
          cd deploy/rke2/base
          sed -i "s/newTag:.*/newTag: v${{ steps.version.outputs.VERSION }}/" kustomization.yaml
      - name: Create Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          generate_release_notes: true
          files: |
            deploy/k3s/base/*.yaml
            deploy/rke2/prod/*.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release manifest provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            deploy/k3s/base/*.yaml
            deploy/rke2/prod/*.yaml
      - name: Commit updated manifests
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add deploy/
          git commit -m "release: update manifests for v${{ steps.version.outputs.VERSION }}"
          git push origin HEAD:main
permissions:
  contents: read
